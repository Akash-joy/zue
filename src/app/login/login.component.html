<div class="flex justify-content-center flex-wrap mt-6">
  <div class="surface-card p-4 shadow-2 border-round w-full lg:w-6 flex justify-content-center flex-wrap">
    <div>
        <label for="email1" class="block text-900 font-medium mb-2">User Name</label>
        <input type="text" pInputText [(ngModel)]="username" />

        <label for="password1" class="block text-900 font-medium mb-2">Password</label>
        <input type="text" pInputText [(ngModel)]="password" />

        <button pButton pRipple label="Login" icon="pi pi-user" class="ml-4" (click)="login()"></button>
    </div>
  </div>
</div>
